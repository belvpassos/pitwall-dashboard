services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: pitwall-timescaledb
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall
    ports:
      -"5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

    mes:
    data: